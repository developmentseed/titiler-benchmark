services:
  titiler-pgstac:
    image: ghcr.io/stac-utils/titiler-pgstac:3.0.2
    ports:
      - "8080:8080"
    environment:
      # GDAL Config
      - GDAL_CACHEMAX=200
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - CPL_VSIL_CURL_CACHE_SIZE=200000000
      # TiTiler Config
      - MOSAIC_CONCURRENCY=5
      - TITILER_PGSTAC_API_DEBUG=TRUE
      # Postgres connection
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
      - PGHOST=database
      - PGPORT=5432
    command: ["uvicorn", "titiler.pgstac.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    depends_on:
      - database

  titiler-stacapi:
    image: ghcr.io/developmentseed/titiler-stacapi:2.1.0
    ports:
      - "8081:8081"
    environment:
      # GDAL Config
      - GDAL_CACHEMAX=200
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - CPL_VSIL_CURL_CACHE_SIZE=200000000
      # TiTiler Config
      - MOSAIC_CONCURRENCY=5
      - TITILER_STACAPI_API_DEBUG=TRUE
      - TITILER_STACAPI_STAC_API_URL=http://stac-api:8888
    command: ["uvicorn", "titiler.stacapi.main:app", "--host", "0.0.0.0", "--port", "8081", "--workers", "1"]
    depends_on:
      - stac-api

  async-titiler-stacapi:
    image: ghcr.io/developmentseed/async-titiler:latest
    ports:
      - "8082:8082"
    environment:
      - ATITILER_API_DEBUG=true
      - ATITILER_STACAPI_URL=http://stac-api:8888
    command: ["uvicorn", "async_titiler.stac.main:app", "--host", "0.0.0.0", "--port", "8082", "--workers", "1"]
    depends_on:
      - stac-api

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.3.1
    environment:
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
      - PGHOST=database
      - PGPORT=5432
      - WEB_CONCURRENCY=10
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=1
      - USE_API_HYDRATE=false
      - ENABLE_TRANSACTIONS_EXTENSIONS=false
      - ENABLE_CATALOGS_EXTENSION=false
    ports:
      - "8888:8888"
    command: ["uvicorn", "stac_fastapi.pgstac.app:app", "--host", "0.0.0.0", "--port", "8888"]
    depends_on:
      database:
        condition: service_healthy

  database:
    image: ghcr.io/stac-utils/pgstac:v0.9.11
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgis
      - PGUSER=username
      - PGDATABASE=postgis
    ports:
      - "5439:5432"
    command: postgres -N 500
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgis"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s