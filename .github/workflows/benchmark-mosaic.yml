name: benchmark-mosaic

# On every pull request, but only on push to main
on:
  push:
    branches:
    - main
    paths:
      - 'mosaic/**'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - '.github/workflows/benchmark-mosaic.yml'

  pull_request:
env:
  LATEST_PY_VERSION: '3.14'

jobs:
  benchmark-mosaic:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push benchmark results to gh-benchmarks branch
      pull-requests: write # Leave PR comments when benchmark regressions exceed alert threshold
    env:
      PGSTAC_VERSION: '0.9.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.*" 
          enable-cache: false
          python-version: ${{ env.LATEST_PY_VERSION }}
     
      - name: Install dependencies
        run: |
          uv sync
          uv pip install pypgstac==${{ env.PGSTAC_VERSION }}

      - name: Launch services
        run: docker compose up -d
        env:
          PGSTAC_VERSION: ${{ env.PGSTAC_VERSION }}

      - name: install lib postgres
        uses: nyurik/action-setup-postgis@228cfe4dd41aad01801a0bdc767040e5024fff1d # v2

      - name: Ingest Stac Items/Collection
        run: |
          uv run pypgstac pgready --dsn postgresql://username:password@0.0.0.0:5439/postgis
          uv run pypgstac load collections mosaic/stac/collection.json --dsn postgresql://username:password@0.0.0.0:5439/postgis --method upsert
          uv run pypgstac load items mosaic/stac/items.json --dsn postgresql://username:password@0.0.0.0:5439/postgis --method upsert

      - name: Sleep for 10 seconds
        run: sleep 10s
        shell: bash

      - name: Run Benchmark
        run: |
          uv run pytest ./mosaic/benchmarks.py --benchmark-only --benchmark-columns 'min, max, mean, median' --benchmark-json output.json

      - name: install siege
        run: |
          sudo apt update
          sudo apt install --yes siege jq
          siege -C

      - name: Run siege (titiler-pgstac)
        run: |
          siege --file ./mosaic/urls.txt -b -c 10 -r 200 --json-output 2>&1 | jq -c > results.json
          echo "Benchmark Results"
          cat results.json | jq
          echo "Parse Results"
          cat results.json | jq '{"name": "titiler-pgstac elapsed_time", "unit": "s", "value": .elapsed_time}, {"name": "titiler-pgstac data_transferred", "unit": "Megabytes", "value": .data_transferred}, {"name": "titiler-pgstac response_time", "unit": "s", "value": .response_time}, {"name": "titiler-pgstac longest_transaction", "unit": "s", "value": .longest_transaction}' > output.json
        env:
          PORT: 8080
          HOST: 127.0.0.1

      - name: Run siege (titiler-stacapi)
        run: |
          siege --file ./mosaic/urls.txt -b -c 10 -r 200 --json-output 2>&1 | jq -c > results.json
          echo "Benchmark Results"
          cat results.json | jq
          echo "Parse Results"
          cat results.json | jq '{"name": "titiler-stacapi elapsed_time", "unit": "s", "value": .elapsed_time}, {"name": "titiler-stacapi data_transferred", "unit": "Megabytes", "value": .data_transferred}, {"name": "titiler-stacapi response_time", "unit": "s", "value": .response_time}, {"name": "titiler-stacapi longest_transaction", "unit": "s", "value": .longest_transaction}' >> output.json
        env:
          PORT: 8081
          HOST: 127.0.0.1          

      - name: Run siege (async-titiler-stacapi)
        run: |
          siege --file ./mosaic/urls.txt -b -c 10 -r 200 --json-output 2>&1 | jq -c > results.json
          echo "Benchmark Results"
          cat results.json | jq
          echo "Parse Results"
          cat results.json | jq '{"name": "async-titiler-stacapi elapsed_time", "unit": "s", "value": .elapsed_time}, {"name": "async-titiler-stacapi data_transferred", "unit": "Megabytes", "value": .data_transferred}, {"name": "async-titiler-stacapi response_time", "unit": "s", "value": .response_time}, {"name": "async-titiler-stacapi longest_transaction", "unit": "s", "value": .longest_transaction}' >> output.json
        env:
          PORT: 8082
          HOST: 127.0.0.1          

      - name: Merge Outputs
        run: |
          cat output.json | jq '[inputs]' > benchmark.json
          cat benchmark.json | jq

      - name: Stop services
        if: always()
        run: docker compose stop

