services:
  titiler:
    image: ghcr.io/developmentseed/titiler:2.4.1
    ports:
      - "8080:8080"
    environment:
      # GDAL Config
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - VSI_CACHE=TRUE
      - CPL_VSIL_CURL_NON_CACHED="/vsicurl/https://titiler-benchmark-public.s3.us-east-1.amazonaws.com/cogs/S2C_33TVF_20260928_0_L2A_B04.tif"
      # TiTiler Config
      - TITILER_API_DEBUG=FALSE
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]

  async-titiler:
    image: ghcr.io/developmentseed/async-titiler:latest
    ports:
      - "8081:8081"
    environment:
      - ATITILER_API_DEBUG=FALSE
    command: ["uvicorn", "async_titiler.main:app", "--host", "0.0.0.0", "--port", "8081", "--workers", "1"]
